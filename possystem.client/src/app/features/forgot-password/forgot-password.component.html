<div class="container-fluid vh-100 p-0">
  <div class="row g-0 h-100">
    <div class="col-md-6 d-none d-md-block login-image"></div>

    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div class="login-form-wrapper">
        <h1 class="text-center mb-2">Forgot Password?</h1>
        <p class="text-center text-muted mb-4">
          Enter your email address and we will send you a link to reset your password.
        </p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" class="form-control"
                   placeholder="Enter your email"
                   formControlName="email" maxlength="100" autocomplete="email"
                   [class.is-invalid]="email?.invalid && email?.touched">
            <div class="invalid-feedback">
              Please enter a valid email address.
            </div>
          </div>

          <div *ngIf="submitted" class="alert alert-success py-2" role="status">
            If an account exists for that email, a reset link has been sent. Please check your inbox.
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger py-2" role="alert">
            {{ errorMessage }}
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold"
                  [disabled]="loading || cooldown > 0">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            {{ cooldown > 0 ? 'Resend in ' + cooldown + 's' : 'Send Reset Link' }}
          </button>
        </form>

        <p class="text-center mt-3">
          <a routerLink="/login" class="text-decoration-none">Back to Log In</a>
        </p>
      </div>
    </div>
  </div>
</div>
