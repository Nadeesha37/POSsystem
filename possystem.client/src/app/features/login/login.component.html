<div class="container-fluid vh-100 p-0">
  <div class="row g-0 h-100">
    <div class="col-md-6 d-none d-md-block login-image"></div>

    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div class="login-form-wrapper">
        <h1 class="text-center mb-4">Log In</h1>

        <form [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">Username or Email Address</label>
            <input type="text" id="username" class="form-control"
                   placeholder="Enter your username/email"
                   formControlName="username" maxlength="50" autocomplete="username"
                   [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            <div class="invalid-feedback">
              Enter a valid username or email (3 to 50 characters, letters, numbers, &#64; . _ - only)
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control"
                   placeholder="Enter your password"
                   formControlName="password" maxlength="100" autocomplete="current-password"
                   [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <div class="invalid-feedback">
              Password must be at least 6 characters
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label" for="rememberMe">Remember Me</label>
            </div>
            <a href="/forgot-password" class="text-decoration-none">Forgot Password?</a>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger py-2">
            {{ errorMessage }}
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">
            Log In
          </button>
        </form>

        <p class="text-center mt-3">
          Don't have an account? <a href="javascript:void(0)">Sign up here.</a>
        </p>
      </div>
    </div>
  </div>
</div>
