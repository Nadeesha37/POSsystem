<div class="container-fluid vh-100 p-0">
  <div class="row g-0 h-100">
    <div class="col-md-6 d-none d-md-block login-image"></div>

    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div class="login-form-wrapper">
        <h1 class="text-center mb-4">Reset Password</h1>

        <div *ngIf="tokenInvalid" class="alert alert-danger" role="alert">
          This reset link is invalid or has expired.
          <a routerLink="/forgot-password">Request a new link</a>
        </div>

        <div *ngIf="success" class="alert alert-success" role="status">
          Your password has been reset. Redirecting to Log In...
        </div>

        <form *ngIf="!tokenInvalid && !success" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
          <div class="mb-2">
            <label for="newPassword" class="form-label">New Password</label>
            <div class="input-group">
              <input [type]="showPassword ? 'text' : 'password'" id="newPassword" class="form-control"
                     placeholder="Enter new password"
                     formControlName="newPassword" maxlength="64" autocomplete="new-password"
                     [class.is-invalid]="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">
              <button type="button" class="btn btn-outline-secondary"
                      (click)="showPassword = !showPassword"
                      [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                {{ showPassword ? 'Hide' : 'Show' }}
              </button>
            </div>
          </div>

          <div *ngIf="form.get('newPassword')?.value" class="mb-2">
            <div class="progress" style="height: 6px;">
              <div class="progress-bar" [ngClass]="strengthClass" [style.width.%]="strength * 25"></div>
            </div>
            <small class="text-muted">{{ strengthLabel }}</small>
          </div>

          <ul class="list-unstyled small mb-3">
            <li *ngFor="let r of rules" [class.text-success]="r.ok" [class.text-muted]="!r.ok">
              {{ r.ok ? '✔' : '○' }} {{ r.label }}
            </li>
          </ul>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input [type]="showPassword ? 'text' : 'password'" id="confirmPassword" class="form-control"
                   placeholder="Re-enter new password"
                   formControlName="confirmPassword" maxlength="64" autocomplete="new-password"
                   [class.is-invalid]="form.hasError('mismatch') && form.get('confirmPassword')?.touched">
            <div class="invalid-feedback">
              Passwords do not match.
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger py-2" role="alert">
            {{ errorMessage }}
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            Reset Password
          </button>
        </form>

        <p class="text-center mt-3">
          <a routerLink="/login" class="text-decoration-none">Back to Log In</a>
        </p>
      </div>
    </div>
  </div>
</div>
